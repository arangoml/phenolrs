# Pre-commit hooks for phenolrs
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Committed-secret detection at commit time. This is the only tier that can
  # stop key material before it reaches the remote at all: the CI secret-scan
  # job reports after the push, and by then the value has to be rotated
  # regardless of whether the commit is reverted.
  #
  # rev is a COMMIT SHA, not a tag: pre-commit resolves rev against the remote
  # at install time, and a tag can be moved, so a tag pin is a mutable
  # reference to third-party code that runs on every commit. This sha is
  # gitleaks v8.30.1. Bump both the sha and the comment together.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^python/

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^python/
        args: ["--profile", "black"]

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^python/
        additional_dependencies:
          - flake8-pyproject

  # Python security linting with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        files: ^python/phenolrs/
        args: ["-r"]

  # Rust formatting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

