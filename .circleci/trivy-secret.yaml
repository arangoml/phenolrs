# Trivy secret-scanner config, passed as secret-config-path.
# Trivy's built-in `tests` allow-rule suppresses every finding under a test-looking path: measured on v0.72.0,
# one identical 40-character PAT is detected in src/, docs/ and vendor/ and not in tests/ or test_*.py.
# python/tests/ starts a real ArangoDB with real credentials and docker/ holds its TLS material, so that tree
# is the most likely place a credential gets committed here. Push protection matches known providers only.
# Report-only until one enumeration cycle on main has given each genuine fixture a dated allow-rule; flipping
# first reds the gate on unreviewed fixtures. docker/server.pem is reported and deliberately not allow-ruled,
# because the fix is generating it at fixture start-up.
# disable-allow-rules is generic and safe to copy; allow-rules entries are repo-specific and never are.

# Keeping test code in secret scope is re-reviewed annually. review by: 2027-07-29
disable-allow-rules:
  # Built-in rule that excludes tests/, testdata/, *_test.* and test_*.* from secret detection entirely.
  - tests

# Dated allow-rules for genuine, non-live fixtures go here after the enumeration cycle. Each needs a
# `review by: YYYY-MM-DD`; disposition-check fails the build once a date passes. Shape:
#
# allow-rules:
#   # Deterministic non-live token used by the loader unit tests.
#   # review by: 2027-07-29
#   - id: loader-unit-fixture-token
#     description: static non-live token in the loader unit tests
#     path: python/tests/fixtures\.py
