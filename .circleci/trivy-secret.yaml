# Trivy secret-scanner configuration for this repository.
# Passed to the secret-capable scan as `secret-config-path`.
#
# WHY THIS FILE EXISTS
# Trivy ships built-in ALLOW rules, and one of them ("tests") suppresses every
# finding whose path looks like test code. Measured on trivy v0.72.0 with one
# identical generated 40-character GitHub PAT: it is detected in src/, docs/,
# fixtures/ and vendor/, and NOT detected in tests/, test/, testdata/,
# test_*.py or *_test.go. Every baked-credential incident in this fleet lived
# in exactly that tree.
#
# python/tests/ here starts a real ArangoDB via docker/start_db.sh and talks to
# it with real credentials, and docker/ carries the local TLS material for that
# fixture, so leaving the secret layer blind to test paths would hide the
# single most likely place for a credential to be committed in this repo.
# GitHub push protection is not a compensating control: it matches
# provider-recognised patterns only.
#
# GATE STATUS: secret-scan is REPORT-ONLY (fail-on-findings false, severity
# CRITICAL,HIGH,MEDIUM,LOW). The flip to blocking happens after one
# report-only enumeration cycle on main: read the secret-scan job's findings,
# add a dated allow-rule below for each genuine non-live fixture, then set
# fail-on-findings true, add the job to .github/required-checks.txt and add it
# to build's requires: chain. Flipping before that cycle turns the gate red on
# fixtures nobody has reviewed, which is how a gate gets switched off for good.
#
# KNOWN FINDING AT HEAD: docker/server.pem, an unencrypted RSA private key
# committed for the local ArangoDB test fixture. It is reported, deliberately
# NOT allow-ruled: the correct fix is to generate that key at fixture start-up
# instead of committing it, and an allow-rule here would remove the reminder.
# See Known gaps in SECURITY.md.
#
# FLEET TEMPLATE NOTE: disable-allow-rules below is generic and safe to copy.
# Any allow-rules entries are repo-specific acceptances and MUST NOT be
# copied; a copied allow-rule silently suppresses a real credential in the
# copying repository.

# Re-review the decision to keep test code in secret scope on the annual
# control review. review by: 2027-07-29
disable-allow-rules:
  # Built-in allow rule that excludes tests/, test/, testdata/, *_test.* and
  # test_*.* from secret detection entirely.
  - tests

# Dated allow-rules for genuine, non-live fixtures go here after the
# report-only enumeration cycle. Each needs a `review by: YYYY-MM-DD` date;
# the disposition-check job fails the build once a date passes. Shape:
#
# allow-rules:
#   # Deterministic non-live token used by the loader unit tests.
#   # review by: 2027-07-29
#   - id: loader-unit-fixture-token
#     description: static non-live token in the loader unit tests
#     path: python/tests/fixtures\.py
